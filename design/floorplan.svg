  <!-- Title -->
  <text x="50" y="30" font-size="24" font-weight="300" fill="#222">1. Obergeschoss</text>
  <text x="50" y="45" font-size="10" fill="#999" font-style="italic">Reconstructed Floorplan (Proportional scaled SVG)</text>

  <!-- ==================== ROOM FILLS ==================== -->
  <g stroke="#333" stroke-width="1">
    <!-- Bad background -->
    <rect x="62" y="62" width="147" height="183" fill="#e4ecf5" />
    <!-- Dusche background -->
    <rect x="215" y="62" width="130" height="183" fill="#e4ecf5" />
    <!-- Treppenhaus background -->
    <rect x="450" y="62" width="285" height="180" fill="#f8f8f8" />
    <rect x="546" y="62" width="189" height="180" fill="url(#stair-hatch)" />
    <!-- Zimmer background -->
    <rect x="62" y="248" width="280" height="210" fill="#f8f8f8" />
    <!-- Zimmer background -->
    <rect x="62" y="458" width="280" height="162" fill="#f8f8f8" />
    <!-- Zimmer background -->
    <rect x="62" y="620" width="280" height="162" fill="#f8f8f8" />
    <!-- Balkon background -->
    <rect x="738" y="248" width="90" height="463" fill="#eaf5ea" stroke="#555" stroke-dasharray="6,4" />
  </g>

  <!-- Rooms drawn without standard outline border -->
  <rect x="348" y="143" width="102" height="639" fill="#f8f8f8" stroke="none" />
  <rect x="450" y="248" width="285" height="150" fill="#f8f8f8" stroke="none" />
  <rect x="450" y="398" width="283" height="313" fill="#f8f8f8" stroke="none" />
  <rect x="447" y="716" width="381" height="150" fill="#eaf5ea" stroke="none" />
  <rect x="738" y="248" width="90" height="463" fill="#eaf5ea" stroke="#555" stroke-dasharray="6,4" />

  <!-- Open plan dividers -->
  <line x1="450" y1="398" x2="450" y2="711" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- ==================== WARDROBES & KITCHEN [X] ==================== -->
