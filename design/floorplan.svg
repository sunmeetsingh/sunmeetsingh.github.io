    <rect x="600" y="687" width="118" height="12" rx="2" ry="2" fill="#d8d8d8" />
    <rect x="677" y="504" width="41" height="12" rx="2" ry="2" fill="#d8d8d8" />
    <rect x="677" y="516" width="41" height="65" rx="3" ry="3" />
    <rect x="677" y="581" width="41" height="65" rx="3" ry="3" />
    <rect x="600" y="646" width="118" height="41" rx="3" ry="3" />
